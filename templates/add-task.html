<!DOCTYPE html>
<html lang="en" data-theme="vanilla" data-mode="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Task | Plannify</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Merriweather:wght@400;700&family=Nunito:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">



    <script src="{{ url_for('static', filename='js/settings-core.js') }}"></script>
</head>

<body>
    <div class="app">

        <!-- Mobile top bar -->
        <header class="topbar">
            <button class="icon-btn topbar-btn" id="menuBtn" aria-label="Open menu" aria-controls="sidebar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <span class="topbar-title">Plannify</span>
        </header>
        <div class="scrim" id="scrim"></div>

        <!-- Side navigation -->
        <aside class="sidebar" id="sidebar">
            <a class="brand" href="add.html">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M5 13l4 4L19 7" />
                    </svg>
                </span>
                Plannify
            </a>

            <nav class="nav" aria-label="Main">
                <a href="add.html" class="active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M12 8v8M8 12h8" />
                    </svg>
                    Add Task
                </a>
                <a href="tasks.html" class="">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 6h11M9 12h11M9 18h11" />
                        <path d="M3.5 6l1.2 1.2L6.8 5M3.5 12l1.2 1.2L6.8 11M3.5 18l1.2 1.2L6.8 17" />
                    </svg>
                    To-Do List
                    <span class="nav-badge" data-pending-count hidden>0</span>
                </a>
                <a href="calendar.html" class="">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="4.5" width="18" height="16" rx="3" />
                        <path d="M3 10h18M8 2.5v4M16 2.5v4" />
                    </svg>
                    Calendar
                </a>
                <a href="settings.html" class="">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
                        <circle cx="16" cy="7" r="2" />
                        <circle cx="8" cy="17" r="2" />
                    </svg>
                    Settings
                </a>
            </nav>

            <div class="side-foot">
                <span class="side-foot-label">Today</span>
                <strong id="sideDate">&nbsp;</strong>
            </div>
        </aside>

        <!-- Page content -->
        <main class="main">

            <div class="page-head">
                <h1>Add a new task</h1>
                <p>Capture what needs doing, when it's due, and how important it is.</p>
            </div>

            <div class="grid-2">
                <section class="card">
                    <form id="addForm" novalidate>

                        <div class="field">
                            <label for="add-name">Task name</label>
                            <input id="add-name" name="taskName" type="text" maxlength="120"
                                placeholder="e.g. Finish project report" required autocomplete="off">
                        </div>

                        <div class="field-row">
                            <div class="field">
                                <label for="add-date">Due date</label>
                                <input id="add-date" name="date" type="date" required>
                            </div>
                            <div class="field">
                                <label for="add-time">Time <span class="opt">(optional)</span></label>
                                <input id="add-time" name="time" type="time">
                            </div>
                        </div>

                        <fieldset class="field">
                            <legend>Priority</legend>
                            <div class="prio-group">
                                <label class="prio p-low"><input type="radio" name="priority"
                                        value="low"><span>Low</span></label>
                                <label class="prio p-medium"><input type="radio" name="priority" value="medium"
                                        checked><span>Medium</span></label>
                                <label class="prio p-high"><input type="radio" name="priority"
                                        value="high"><span>High</span></label>
                            </div>
                        </fieldset>
                        <p class="form-error" id="addError" role="alert" hidden></p>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                                    stroke-width="2.4" stroke-linecap="round">
                                    <path d="M12 5v14M5 12h14" />
                                </svg>
                                Add task
                            </button>
                            <button type="reset" class="btn btn-ghost" id="addReset">Clear</button>
                        </div>
                    </form>
                </section>

                <aside class="stack">
                    <section class="stats">
                        <div class="stat"><span class="stat-num" id="statPending">0</span><span
                                class="stat-label">Pending</span></div>
                        <div class="stat"><span class="stat-num" id="statToday">0</span><span class="stat-label">Due
                                today</span></div>
                        <div class="stat"><span class="stat-num" id="statDone">0</span><span
                                class="stat-label">Completed</span></div>
                    </section>

                    <section class="card">
                        <div class="card-head">
                            <h2>Up next</h2>
                            <a class="link" href="tasks.html">View all</a>
                        </div>
                        <ul class="mini-list" id="upNext"></ul>
                    </section>
                </aside>
            </div>

        </main>
    </div>

    <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>



    <script src="{{ url_for('static', filename='js/common.js') }}"></script>

    <script src="{{ url_for('static', filename='js/add-task.js') }}"></script>

</body>

</html>
